name: Build and Push Cogni-Test Image to GHCR

on: push

jobs:
    build:
        name: Build and Push Cogni-Test Image to GHCR
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write
            id-token: write

        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: true

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set environment
              run: |
                  if [[ "${{ github.ref_name }}" == "main" ]]; then
                    echo "MODE=PROD" >> $GITHUB_ENV
                    echo "TAG=latest" >> $GITHUB_ENV
                  else
                    echo "MODE=DEV" >> $GITHUB_ENV
                    # Docker-тег допускает только [a-zA-Z0-9_.-] и должен начинаться
                    # с буквы/цифры/_, поэтому чистим имя ветки (feature/x -> feature-x)
                    TAG=$(echo "${{ github.ref_name }}" | sed -E -e 's/[^a-zA-Z0-9_.-]+/-/g' -e 's/^[^a-zA-Z0-9_]+//' | cut -c1-128)
                    echo "TAG=${TAG}" >> $GITHUB_ENV
                  fi

            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository }}/cogni-test:${{ env.TAG }}
                  build-args: |
                      MODE=${{ env.MODE }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
